name: Continuous Integration

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: pnpm/action-setup@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📂 Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: ♻️ Restore pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint Workspace
        run: pnpm turbo run lint

      - name: 🔎 Type Check Workspace
        run: pnpm turbo run typecheck

      - name: 🏗️ Build Workspace
        run: pnpm turbo run build

      # - name: 🧪 Run Unit Tests
      #   run: pnpm turbo run test

      # # -----------------------------
      # # Quality Gate 5 — Contract Tests
      # # -----------------------------
      #       - name: 📜 Run Contract Tests
      #         run: pnpm turbo run test:contract

      # # -----------------------------
      # # Quality Gate 6 — Serialization Tests
      # # -----------------------------
      #       - name: 🔄 Run Serialization Tests
      #         run: pnpm turbo run test:serialization

      # # -----------------------------
      # # Quality Gate 7 — Integration Tests
      # # -----------------------------
      #       - name: 🔗 Run Integration Tests
      #         run: pnpm turbo run test:integration

      # -----------------------------
      # Coverage Report
      # -----------------------------
      - name: 📊 Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      # -----------------------------
      # Test Results
      # -----------------------------
      - name: 📋 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # -----------------------------
      # Playwright Report
      # -----------------------------
      # - name: 🎭 Upload Playwright Report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     if-no-files-found: ignore
      #     retention-days: 7

      # -----------------------------
      # Build Outputs
      # -----------------------------
      - name: 📦 Upload Build Outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/dist/**
            **/build/**
            **/.next/**
          if-no-files-found: ignore
          retention-days: 7
